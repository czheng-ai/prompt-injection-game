databases:
  - name: prompt-injection-db
    databaseName: prompt_injection_game
    user: prompt_injection_user
    plan: free

services:
  - type: web
    name: prompt-injection-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_MODE
        value: real
      - key: BOT_DETECTION_ENABLED
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-injection-db
          property: connectionString
